# ============================================================================
# SDB Framework — portable run configuration (repository root)
#
# ALWAYS run the framework with this file:
#   python sdb_framework_final.py --mode full --config config.yaml
#
# When --config is supplied, these relative paths are used and the original
# placeholder defaults inside the paper code are never touched — so the
# published code stays 100% unchanged while running on any machine.
# ============================================================================

# --- I/O -------------------------------------------------------------------
excel_path: data/SDBNew Latlong.xlsx
raster_path: data/20220213_SDB_5bands.tif
output_dir: outputs/full_run

# --- Field-data schema (aliases are auto-detected) -------------------------
id_col: En_Name
lon_col: Longitude
lat_col: Latitude
depth_col: Depth

# --- Reproducibility -------------------------------------------------------
random_seed: 42
n_jobs: -1

# --- Sensor / physics ------------------------------------------------------
band_order: [B2, B3, B4, B8, B11]
points_crs: "EPSG:4326"
n_const: 1000.0
# reflectance_scale: 10000.0   # uncomment to override auto-detection

# --- Validation ------------------------------------------------------------
cv_strategy: spatial_loo        # loo | spatial_loo | repeated_spatial_cv | kfold
n_repeats: 10
n_bootstrap_ci: 2000
holdout_fraction: 0.20
n_spatial_blocks: 20
spatial_cv_folds: 5

# --- 3 m design envelope ---------------------------------------------------
depth_bins: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
prediction_max_depth: 3.0
tile_size: 1024
