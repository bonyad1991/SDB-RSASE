   "source": [
    "# ============================================================================\n",
    "# SDB Framework — example configuration\n",
    "#\n",
    "# Copy to configs/config.yaml and run:\n",
    "#   python sdb_framework_final.py --mode full --config configs/config.yaml\n",
    "#\n",
    "# All paths are RELATIVE to the repository root, so this file works on\n",
    "# Windows, macOS and Linux without modification.\n",
    "# ============================================================================\n",
    "\n",
    "# --- I/O -------------------------------------------------------------------\n",
    "excel_path: data/SDBNew Latlong.xlsx\n",
    "raster_path: data/20220213_SDB_5bands.tif\n",
    "output_dir: outputs/full_run\n",
    "\n",
    "# --- Field-data schema (aliases are auto-detected) -------------------------\n",
    "id_col: En_Name\n",
    "lon_col: Longitude\n",
    "lat_col: Latitude\n",
    "depth_col: Depth\n",
    "\n",
    "# --- Reproducibility -------------------------------------------------------\n",
    "random_seed: 42\n",
    "n_jobs: -1\n",
    "\n",
    "# --- Sensor / physics ------------------------------------------------------\n",
    "band_order: [B2, B3, B4, B8, B11]\n",
    "points_crs: \"EPSG:4326\"\n",
    "n_const: 1000.0\n",
    "# reflectance_scale: 10000.0   # uncomment to override auto-detection\n",
    "\n",
    "# --- Validation ------------------------------------------------------------\n",
    "cv_strategy: spatial_loo        # loo | spatial_loo | repeated_spatial_cv | kfold\n",
    "n_repeats: 10\n",
    "n_bootstrap_ci: 2000\n",
    "holdout_fraction: 0.20\n",
    "n_spatial_blocks: 20\n",
    "spatial_cv_folds: 5\n",
    "\n",
    "# --- 3 m design envelope ---------------------------------------------------\n",
    "depth_bins: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0]\n",
    "prediction_max_depth: 3.0\n",
    "tile_size: 1024\n"
   ]
  }
 ],
